name: checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.26
      - run: ./scripts/bootstrap
      - run: ./scripts/pio run
      - run: ./scripts/test
      - run: ./scripts/test-ui
      - run: for seed in 1 7 999 4294967295; do build/table "$seed"; done
